# Continuous integration (docs/plans/fsm-v1/plan.md, C-10 and Verification; docs/plans/fsm-v1/checklist.md, S-21). The job kit calls the kit pipeline (ci-pipeline.yml, K910), and the job check runs
# `make install` and then `make check`, the full suite of the repository, with the PostgreSQL and MySQL services of plan C-6.
# The versions come from the files that declare them: PHP from config/toolchain.json, Rust from rust-toolchain.toml, and
# Node.js, Go, Python and uv from mise.toml, which mise installs at the digests of mise.lock: Node.js with make install-tools
# TOOLS=npm, which the node of setup-node only starts (kit K171), and the others with make install (install-tools, S-44-6). The workflow runs on every push to main and on a manual run (workflow_dispatch). A newer push does
# not cancel the run of an earlier one.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; the job installs the toolchain of rust-toolchain.toml first.
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  kit:
    uses: ./.github/workflows/ci-pipeline.yml
  check:
    needs: kit
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fsm
          POSTGRES_PASSWORD: fsm
          POSTGRES_DB: fsm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fsm -d fsm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: fsm
          MYSQL_PASSWORD: fsm
          MYSQL_DATABASE: fsm_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FSM_TEST_PG_DSN: postgres://fsm:fsm@127.0.0.1:5432/fsm_test?sslmode=disable
      FSM_TEST_MYSQL_DSN: mysql://fsm:fsm@127.0.0.1:3306/fsm_test
      FSM_TEST_PG_ADMIN_DSN: postgres://fsm:fsm@127.0.0.1:5432/fsm_test?sslmode=disable
      FSM_TEST_MYSQL_ADMIN_DSN: mysql://root:root@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          extensions: pdo_pgsql, pdo_mysql
      - name: bootstrap the installed kit package
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: Install kit, the npm of packageManager and then @polyspec/kit of package-lock.json
        run: |
          make install-tools TOOLS=npm
          make install-packages
      # make install-tools of make install installs the Rust toolchain of rust-toolchain.toml with its components (kit K151).
      - name: Install the toolchains and the package dependencies
        run: make install
      - name: Install the system libraries of Chromium
        run: sudo env PATH="$PATH" npx playwright install-deps chromium
        working-directory: packages/gui
      - name: Run the suite targets through make ci-targets
        run: make ci-targets TARGETS="compiler-test db-test db-test-postgres db-test-mysql npm-persist-test npm-persist-test-postgres npm-persist-test-mysql gui-test npm-types name-test name-check docs-build docs-build-test packages-test gui-browser-test readme-test readme-check python-tools-test make-install-test rust-persist-test go-persist-test-postgres go-persist-test-mysql rust-persist-test-postgres rust-persist-test-mysql php-persist-test-postgres php-persist-test-mysql php-ext-persist-test-postgres php-ext-persist-test-mysql python-persist-test-postgres python-persist-test-mysql workflows-test"
