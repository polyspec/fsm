[package]
name = "polyspec-fsm"
version = "0.0.13"
edition = "2021"
rust-version = "1.99.0"
description = "The core of fsm: a state machine read from its definition, its codes and keys, and its transitions"
readme = "README.md"
repository = "https://github.com/polyspec/fsm.git"
publish = false
# The package holds the interface contract of the bindings beside the source (binding design I-1).
include = ["/src/**/*.rs", "/interface.json", "/README.md"]

[dependencies]
# The kind interface that the generated bindings read from the core error (binding design E-1). The git source is the binding
# repository; the root Cargo.lock pins its commit, the same source as the generated binding crates.
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", branch = "v1/rust-core" }
# The reader of a definition (docs/spec/fsm.md, B-1), at the exact pin of polyspec-binding-core.
serde_json = "=1.0.154"

[dev-dependencies]
libtest-mimic = "=0.8.2"
serde_json = "=1.0.154"

[lib]
name = "polyspec_fsm"
path = "src/lib.rs"

# One trial per case of contracts/cases.json, so the harness of the test is libtest-mimic.
[[test]]
name = "cases"
harness = false

# The lints of the root workspace (Cargo.toml of the repository), which make lint-rust (cargo clippy) reads.
[lints]
workspace = true
