[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

# The python consumer test bed of fsm (docs/plans/fsm-v1/plan.md, C-2). It is not published: the orm client is pinned to the wheel of its release
# (C-1), and the generated code under src/ and examples/model/ has no runtime dependency beyond the standard library.
[project]
name = "polyspec-fsm-python"
version = "0.0.0"
description = "python consumer test bed of fsm: the generated state machines, the conformance vectors and the B-4 persistence example"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "polyspec-orm @ https://github.com/polyspec/orm/releases/download/v0.0.18/polyspec_orm-0.0.18-py3-none-any.whl",
]

# The examples are a package of the project, so that their tests import them from the installed package (S3): the persist example
# and its generated model are polyspec_fsm_examples.persist and polyspec_fsm_examples.model.models.
[tool.setuptools]
package-dir = { "" = "src", "polyspec_fsm_examples" = "examples", "polyspec_fsm_examples.model" = "examples/model" }
packages = ["polyspec_fsm", "polyspec_fsm_examples", "polyspec_fsm_examples.model"]
