# The folder layout of fsm (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml (which fsm
# took from kit and owns, S-424) and the map of this repository. fsm has the runtime ports of its spec and three components: the compiler, the DB
# store and the GUI. Each path that this map does not allow is a finding of layout-check until the item that moves it
# lands (docs/plans/fsm-v1/checklist.md).
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: fsm }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: fsm }

  # The root files of fsm beside the common ones: .npmrc, which allows the release URL of @polyspec/kit for the npm ci of the
  # root, and knip.jsonc, the knip configuration with the reason of each entry (S-424).
  - extends_template: root-files
    id: layout-root-files
    vars: { root_files: "{.npmrc,knip.jsonc}" }

  # The component of fsm beside the runtime ports: the GUI (docs/plans/fsm-v1/plan.md, C-7). The compiler (fsm-gen), the DB store
  # and the hand-written runtime packages are under legacy/packages since plan f6, step 3-2.
  - id: layout-packages
    paths:
      - "packages/*"
      - "!packages/go"
      - "!packages/php"
      - "!packages/php-ext"
      - "!packages/python"
      - "!packages/rust"
      - "!packages/ts"
      - "!packages/gui"

  # The tool tests of the root: the checks of scripts/ (check-name, check-readmes), the documentation site, the
  # make targets of the package dependencies and of the Python toolchain, and the CI workflows.
  - id: layout-root-tests
    paths:
      - "tests/*"
      - "!tests/check-name"
      # The shared helper of the root tool tests (a temporary Git checkout); it holds no test.
      - "!tests/support"
      - "!tests/check-readmes"
      - "!tests/docs-build"
      - "!tests/make-install"
      # the name tests of the released runtimes (S-410): the manifests of @polyspec/fsm, polyspec-fsm (python) and polyspec-fsm (rust)
      - "!tests/package-names"
      # the tool test of the php-ext persist recipes of the Makefile (S-398, S-399): it reads the Makefile and tracked files, as the tests above do
      - "!tests/php-ext-persist"
      - "!tests/python-tools"
      - "!tests/workflows"
      # the type check of the declarations of legacy/packages/js (S-09-2, make npm-types): tsc compiles tests/npm-types/consumer.ts in strict mode against legacy/packages/js/src/*.d.ts
      - "!tests/npm-types"

  # ---- The kind packages (docs/plans/fsm-v1/plan.md, C-2; S-44 moved these rules from fsm's own check-layout) ----------------
  # Every kind package holds the canonical files and folders, the required files of its kind, and only files that its kind
  # allows. The language-inherent difference of rust: it has no examples/model/, because its build.rs generates the orm model of
  # contracts/schema/persist.dbs into OUT_DIR.
  - id: layout-go-required
    kind: for_each_dir
    level: error
    select: "legacy/packages/go"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/go.mod" }
      - { kind: file_exists, paths: "{path}/go.sum" }
      - { kind: file_exists, paths: "{path}/tests/conformance_test.go" }
      - { kind: file_exists, paths: "{path}/tests/vectors_test.go" }
      - { kind: file_exists, paths: "{path}/tests/persist_test.go" }
      - { kind: file_exists, paths: "{path}/examples/persist.go" }
    message: "C-2: the go package holds the canonical files and the required files of its kind"

  - id: layout-go-folders
    kind: for_each_dir
    level: error
    select: "legacy/packages/go"
    require:
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the go package holds a file in each canonical folder (tests, examples; src is generated and tracked, S-371)"

  - id: layout-go-files
    kind: file_absent
    level: error
    paths:
      - "legacy/packages/go/**"
      - "!legacy/packages/go/README.md"
      - "!legacy/packages/go/README.ko.md"
      - "!legacy/packages/go/go.mod"
      - "!legacy/packages/go/go.sum"
      - "!legacy/packages/go/tests/conformance_test.go"
      - "!legacy/packages/go/tests/vectors_test.go"
      - "!legacy/packages/go/tests/persist_test.go"
      - "!legacy/packages/go/examples/persist.go"
      # the generated packages, tracked: the Go module is installed as its tagged tree (P34, config/generated.json, S-371)
      - "!legacy/packages/go/src/**"
    message: "C-2: a file that the go package does not allow; add it to its canonical, required or allowed files with its reason"

  - id: layout-npm-required
    kind: for_each_dir
    level: error
    select: "legacy/packages/js"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/package.json" }
      - { kind: file_exists, paths: "{path}/package-lock.json" }
      - { kind: file_exists, paths: "{path}/tests/conformance.test.mjs" }
      - { kind: file_exists, paths: "{path}/tests/persist.test.mjs" }
      - { kind: file_exists, paths: "{path}/examples/persist.mjs" }
    message: "C-2: the npm package holds the canonical files and the required files of its kind"

  - id: layout-npm-folders
    kind: for_each_dir
    level: error
    select: "legacy/packages/js"
    require:
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the npm package holds a file in each canonical folder (tests, examples; src is generated and not tracked)"

  - id: layout-npm-files
    kind: file_absent
    level: error
    paths:
      - "legacy/packages/js/**"
      - "!legacy/packages/js/README.md"
      - "!legacy/packages/js/README.ko.md"
      - "!legacy/packages/js/package.json"
      - "!legacy/packages/js/package-lock.json"
      - "!legacy/packages/js/tests/conformance.test.mjs"
      - "!legacy/packages/js/tests/persist.test.mjs"
      - "!legacy/packages/js/examples/persist.mjs"
    message: "C-2: a file that the npm package does not allow; add it to its canonical, required or allowed files with its reason"

  - id: layout-php-required
    kind: for_each_dir
    level: error
    select: "legacy/packages/php"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/composer.json" }
      - { kind: file_exists, paths: "{path}/composer.lock" }
      - { kind: file_exists, paths: "{path}/tests/ConformanceCase.php" }
      - { kind: file_exists, paths: "{path}/tests/ConformanceTest.php" }
      - { kind: file_exists, paths: "{path}/tests/PersistTest.php" }
      - { kind: file_exists, paths: "{path}/examples/persist.php" }
    message: "C-2: the php package holds the canonical files and the required files of its kind"

  - id: layout-php-folders
    kind: for_each_dir
    level: error
    select: "legacy/packages/php"
    require:
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the php package holds a file in each canonical folder (tests, examples; src is generated and not tracked)"

  - id: layout-php-files
    kind: file_absent
    level: error
    paths:
      - "legacy/packages/php/**"
      - "!legacy/packages/php/README.md"
      - "!legacy/packages/php/README.ko.md"
      - "!legacy/packages/php/composer.json"
      - "!legacy/packages/php/composer.lock"
      # the PHPUnit configuration of the php package: kit test-php-ext runs the package with the extension loaded and passes only a filter, so the test folder is declared here
      - "!legacy/packages/php/phpunit.xml.dist"
      - "!legacy/packages/php/tests/ConformanceCase.php"
      - "!legacy/packages/php/tests/ConformanceTest.php"
      - "!legacy/packages/php/tests/PersistTest.php"
      - "!legacy/packages/php/examples/persist.php"
    message: "C-2: a file that the php package does not allow; add it to its canonical, required or allowed files with its reason"

  - id: layout-rust-required
    kind: for_each_dir
    level: error
    select: "legacy/packages/rust"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/Cargo.toml" }
      - { kind: file_exists, paths: "{path}/Cargo.lock" }
      - { kind: file_exists, paths: "{path}/build.rs" }
      - { kind: file_exists, paths: "{path}/tests/conformance/main.rs" }
      - { kind: file_exists, paths: "{path}/tests/conformance/vectors.rs" }
      - { kind: file_exists, paths: "{path}/tests/persist.rs" }
      - { kind: file_exists, paths: "{path}/examples/persist.rs" }
    message: "C-2: the rust package holds the canonical files and the required files of its kind"

  - id: layout-rust-folders
    kind: for_each_dir
    level: error
    select: "legacy/packages/rust"
    require:
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the rust package holds a file in each canonical folder (tests, examples; src is generated and tracked, S-371)"

  - id: layout-rust-files
    kind: file_absent
    level: error
    paths:
      - "legacy/packages/rust/**"
      - "!legacy/packages/rust/README.md"
      - "!legacy/packages/rust/README.ko.md"
      - "!legacy/packages/rust/Cargo.toml"
      - "!legacy/packages/rust/Cargo.lock"
      - "!legacy/packages/rust/build.rs"
      - "!legacy/packages/rust/tests/conformance/main.rs"
      - "!legacy/packages/rust/tests/conformance/vectors.rs"
      - "!legacy/packages/rust/tests/persist.rs"
      # the dialect of the persist tests, the shared module of the test crates tests/conformance/ and tests/persist.rs (S-44-9)
      - "!legacy/packages/rust/tests/common/mod.rs"
      - "!legacy/packages/rust/examples/persist.rs"
      # the generated modules, tracked: the crate is installed as its tagged tree by its git tag (P34, config/generated.json, S-371)
      - "!legacy/packages/rust/src/**"
    message: "C-2: a file that the rust package does not allow; add it to its canonical, required or allowed files with its reason"

  - id: layout-python-required
    kind: for_each_dir
    level: error
    select: "legacy/packages/python"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/pyproject.toml" }
      - { kind: file_exists, paths: "{path}/constraints.txt" }
      - { kind: file_exists, paths: "{path}/pylock.toml" }
      - { kind: file_exists, paths: "{path}/tests/test_conformance.py" }
      - { kind: file_exists, paths: "{path}/tests/test_persist.py" }
      - { kind: file_exists, paths: "{path}/examples/persist.py" }
    message: "C-2: the python package holds the canonical files and the required files of its kind"

  - id: layout-python-folders
    kind: for_each_dir
    level: error
    select: "legacy/packages/python"
    require:
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the python package holds a file in each canonical folder (tests, examples; src is generated and not tracked)"

  - id: layout-python-files
    kind: file_absent
    level: error
    paths:
      - "legacy/packages/python/**"
      - "!legacy/packages/python/README.md"
      - "!legacy/packages/python/README.ko.md"
      - "!legacy/packages/python/pyproject.toml"
      - "!legacy/packages/python/constraints.txt"
      - "!legacy/packages/python/pylock.toml"
      - "!legacy/packages/python/tests/test_conformance.py"
      - "!legacy/packages/python/tests/test_persist.py"
      - "!legacy/packages/python/examples/persist.py"
      # the package of the examples (S3): an empty package file that makes examples an installed package, polyspec_fsm_examples
      - "!legacy/packages/python/examples/__init__.py"
      # the package of the tests (S-395): an empty package file that unittest needs to discover them, which kit runtime-targets checks on CI
      - "!legacy/packages/python/tests/__init__.py"
    message: "C-2: a file that the python package does not allow; add it to its canonical, required or allowed files with its reason"

  - id: layout-php-ext-required
    kind: for_each_dir
    level: error
    select: "legacy/packages/php-ext"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/composer.json" }
      - { kind: file_exists, paths: "{path}/composer.lock" }
    message: "C-2: the php-ext package holds the canonical files and the required files of its kind"

  - id: layout-php-ext-files
    kind: file_absent
    level: error
    paths:
      - "legacy/packages/php-ext/**"
      - "!legacy/packages/php-ext/README.md"
      - "!legacy/packages/php-ext/README.ko.md"
      - "!legacy/packages/php-ext/composer.json"
      - "!legacy/packages/php-ext/composer.lock"
    message: "C-2: a file that the php-ext package does not allow; add it to its canonical, required or allowed files with its reason"

  # ---- The exceptions of fsm to the common layout rules (S9): each exception names its reason in the comment above it ----

  # The golden stub of the PHP extension is test data: legacy/packages/compiler/tests/golden/php-ext holds the expected output of
  # the compiler for the php-ext kind, which php-ext-backend.test.mjs compares with the generated files. It is not the stub
  # of a package. The stub of a package is packages/php-ext/src/*.stub.php (S10), and the legacy package keeps the place of its
  # generated, untracked stub, legacy/packages/php-ext/src/.
  - id: php-ext-stub-place
    paths:
      - "**/*.stub.php"
      - "!packages/php-ext/src/*.stub.php"
      - "!legacy/packages/php-ext/src/*.stub.php"
      - "!legacy/packages/compiler/tests/golden/php-ext/src/*.stub.php"

  # The VitePress site of docs/ is one npm project: docs/package.json and docs/package-lock.json are the input of npm ci in
  # docs (make docs-build, and the Pages workflow that runs it), and the site's config lies in docs/.vitepress.
  - id: docs-files
    paths:
      - "docs/*"
      - "!docs/features.md"
      - "!docs/features.ko.md"
      - "!docs/index.md"
      - "!docs/index.ko.md"
      - "!docs/404.md"
      - "!docs/404.ko.md"
      - "!docs/package.json"
      - "!docs/package-lock.json"

  # AGENTS, CHANGELOG and Makefile lie at the root only: each runtime package's targets are targets of the root Makefile, named
  # fsm-<package>-<task> (K245).
  - id: management-files-at-root
    paths:
      - "packages/**/AGENTS*.md"
      - "packages/**/CHANGELOG*.md"
      - "packages/**/Makefile"

  - id: runtime-language
    paths:
      - "packages/js/**/*.{ts,mts,cts,tsx}"
      - "legacy/packages/js/**/*.{ts,mts,cts,tsx}"
      - "packages/*/js/**/*.{ts,mts,cts,tsx}"
      - "!packages/**/*.d.ts"
      - "!packages/**/*.d.mts"
      - "!packages/**/*.d.cts"
      - "!legacy/packages/**/*.d.ts"
      - "!legacy/packages/**/*.d.mts"
      - "!legacy/packages/**/*.d.cts"

  # The hand-written packages and the fsm-gen output are under legacy/ until plan V-6 (5) removes them (plan f6, FP-6, step 3-2;
  # structure ST-22, ST-38), so legacy is a root folder of fsm beside the common ones.
  - id: layout-root-folders
    paths: ["*", "!packages", "!contracts", "!docs", "!scripts", "!tests", "!examples", "!benchmarks", "!config", "!.github", "!.githooks", "!.kit", "!.mise", "!.claude", "!legacy"]
