# The folder layout of fsm (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml (a copy of
# kit) and the map of this repository. fsm has the runtime ports of its spec and three components: the compiler, the DB
# store and the GUI. Each path that this map does not allow is a finding of layout-check until the item that moves it
# lands (docs/plans/fsm-v1/checklist.md).
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: fsm }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: fsm }

  # The components of fsm beside the runtime ports: the compiler (fsm-gen), the DB store and the GUI (docs/plans/fsm-v1/plan.md, C-5 to C-7).
  - id: layout-packages
    paths:
      - "packages/*"
      - "!packages/go"
      - "!packages/php"
      - "!packages/php-ext"
      - "!packages/python"
      - "!packages/rust"
      - "!packages/ts"
      - "!packages/js"
      - "!packages/compiler"
      - "!packages/db"
      - "!packages/gui"

  # The tool tests of the root: the checks of scripts/ (check-name, check-readmes), the documentation site, the
  # make targets of the package dependencies and of the Python toolchain, and the CI workflows.
  - id: layout-root-tests
    paths:
      - "tests/*"
      - "!tests/check-name"
      # The shared helper of the root tool tests (a temporary Git checkout); it holds no test.
      - "!tests/support"
      - "!tests/check-readmes"
      - "!tests/docs-build"
      - "!tests/make-install"
      - "!tests/python-tools"
      - "!tests/workflows"
      # the type check of the declarations of packages/js (S-09-2, make npm-types): tsc compiles tests/npm-types/consumer.ts in strict mode against packages/js/src/*.d.ts
      - "!tests/npm-types"

  # ---- The kind packages (docs/plans/fsm-v1/plan.md, C-2; S-44 moved these rules from fsm's own check-layout) ----------------
  # Every kind package holds the canonical files and folders, the required files of its kind, and only files that its kind
  # allows. The language-inherent difference of rust: it has no examples/model/, because its build.rs generates the orm model of
  # contracts/schema/persist.dbs into OUT_DIR.
  - id: layout-go-required
    kind: for_each_dir
    level: error
    select: "packages/go"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/go.mod" }
      - { kind: file_exists, paths: "{path}/go.sum" }
      - { kind: file_exists, paths: "{path}/tests/conformance_test.go" }
      - { kind: file_exists, paths: "{path}/tests/vectors_test.go" }
      - { kind: file_exists, paths: "{path}/tests/persist_test.go" }
      - { kind: file_exists, paths: "{path}/examples/persist.go" }
    message: "C-2: the go package holds the canonical files and the required files of its kind"

  - id: layout-go-folders
    kind: for_each_dir
    level: error
    select: "packages/go"
    require:
      - { kind: file_exists, paths: "{path}/src/**" }
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the go package holds a file in each canonical folder (src, tests, examples)"

  - id: layout-go-files
    kind: file_absent
    level: error
    paths:
      - "packages/go/**"
      - "!packages/go/README.md"
      - "!packages/go/README.ko.md"
      - "!packages/go/go.mod"
      - "!packages/go/go.sum"
      - "!packages/go/tests/conformance_test.go"
      - "!packages/go/tests/vectors_test.go"
      - "!packages/go/tests/persist_test.go"
      - "!packages/go/examples/persist.go"
      - "!packages/go/src/**/*.go"
      - "!packages/go/examples/model/**"
    message: "C-2: a file that the go package does not allow; add it to its canonical, required or allowed files with its reason"

  - id: layout-npm-required
    kind: for_each_dir
    level: error
    select: "packages/js"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/package.json" }
      - { kind: file_exists, paths: "{path}/package-lock.json" }
      - { kind: file_exists, paths: "{path}/tests/conformance.test.mjs" }
      - { kind: file_exists, paths: "{path}/tests/persist.test.mjs" }
      - { kind: file_exists, paths: "{path}/examples/persist.mjs" }
    message: "C-2: the npm package holds the canonical files and the required files of its kind"

  - id: layout-npm-folders
    kind: for_each_dir
    level: error
    select: "packages/js"
    require:
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the npm package holds a file in each canonical folder (tests, examples; src is generated and not tracked)"

  - id: layout-npm-files
    kind: file_absent
    level: error
    paths:
      - "packages/js/**"
      - "!packages/js/README.md"
      - "!packages/js/README.ko.md"
      - "!packages/js/package.json"
      - "!packages/js/package-lock.json"
      - "!packages/js/tests/conformance.test.mjs"
      - "!packages/js/tests/persist.test.mjs"
      - "!packages/js/examples/persist.mjs"
    message: "C-2: a file that the npm package does not allow; add it to its canonical, required or allowed files with its reason"

  - id: layout-php-required
    kind: for_each_dir
    level: error
    select: "packages/php"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/composer.json" }
      - { kind: file_exists, paths: "{path}/composer.lock" }
      - { kind: file_exists, paths: "{path}/tests/ConformanceCase.php" }
      - { kind: file_exists, paths: "{path}/tests/ConformanceTest.php" }
      - { kind: file_exists, paths: "{path}/tests/PersistTest.php" }
      - { kind: file_exists, paths: "{path}/examples/persist.php" }
    message: "C-2: the php package holds the canonical files and the required files of its kind"

  - id: layout-php-folders
    kind: for_each_dir
    level: error
    select: "packages/php"
    require:
      - { kind: file_exists, paths: "{path}/src/**" }
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the php package holds a file in each canonical folder (src, tests, examples)"

  - id: layout-php-files
    kind: file_absent
    level: error
    paths:
      - "packages/php/**"
      - "!packages/php/README.md"
      - "!packages/php/README.ko.md"
      - "!packages/php/composer.json"
      - "!packages/php/composer.lock"
      - "!packages/php/tests/ConformanceCase.php"
      - "!packages/php/tests/ConformanceTest.php"
      - "!packages/php/tests/PersistTest.php"
      - "!packages/php/examples/persist.php"
      - "!packages/php/src/**/*.php"
      - "!packages/php/examples/model/**"
    message: "C-2: a file that the php package does not allow; add it to its canonical, required or allowed files with its reason"

  - id: layout-rust-required
    kind: for_each_dir
    level: error
    select: "packages/rust"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/Cargo.toml" }
      - { kind: file_exists, paths: "{path}/Cargo.lock" }
      - { kind: file_exists, paths: "{path}/build.rs" }
      - { kind: file_exists, paths: "{path}/tests/conformance/main.rs" }
      - { kind: file_exists, paths: "{path}/tests/conformance/vectors.rs" }
      - { kind: file_exists, paths: "{path}/tests/persist.rs" }
      - { kind: file_exists, paths: "{path}/examples/persist.rs" }
    message: "C-2: the rust package holds the canonical files and the required files of its kind"

  - id: layout-rust-folders
    kind: for_each_dir
    level: error
    select: "packages/rust"
    require:
      - { kind: file_exists, paths: "{path}/src/**" }
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the rust package holds a file in each canonical folder (src, tests, examples)"

  - id: layout-rust-files
    kind: file_absent
    level: error
    paths:
      - "packages/rust/**"
      - "!packages/rust/README.md"
      - "!packages/rust/README.ko.md"
      - "!packages/rust/Cargo.toml"
      - "!packages/rust/Cargo.lock"
      - "!packages/rust/build.rs"
      - "!packages/rust/tests/conformance/main.rs"
      - "!packages/rust/tests/conformance/vectors.rs"
      - "!packages/rust/tests/persist.rs"
      # the dialect of the persist tests, the shared module of the test crates tests/conformance/ and tests/persist.rs (S-44-9)
      - "!packages/rust/tests/common/mod.rs"
      - "!packages/rust/examples/persist.rs"
      - "!packages/rust/src/*.rs"
    message: "C-2: a file that the rust package does not allow; add it to its canonical, required or allowed files with its reason"

  - id: layout-python-required
    kind: for_each_dir
    level: error
    select: "packages/python"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/pyproject.toml" }
      - { kind: file_exists, paths: "{path}/constraints.txt" }
      - { kind: file_exists, paths: "{path}/pylock.toml" }
      - { kind: file_exists, paths: "{path}/tests/test_conformance.py" }
      - { kind: file_exists, paths: "{path}/tests/test_persist.py" }
      - { kind: file_exists, paths: "{path}/examples/persist.py" }
    message: "C-2: the python package holds the canonical files and the required files of its kind"

  - id: layout-python-folders
    kind: for_each_dir
    level: error
    select: "packages/python"
    require:
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the python package holds a file in each canonical folder (tests, examples; src is generated and not tracked)"

  - id: layout-python-files
    kind: file_absent
    level: error
    paths:
      - "packages/python/**"
      - "!packages/python/README.md"
      - "!packages/python/README.ko.md"
      - "!packages/python/pyproject.toml"
      - "!packages/python/constraints.txt"
      - "!packages/python/pylock.toml"
      - "!packages/python/tests/test_conformance.py"
      - "!packages/python/tests/test_persist.py"
      - "!packages/python/examples/persist.py"
      # the package of the examples (S3): an empty package file that makes examples an installed package, polyspec_fsm_examples
      - "!packages/python/examples/__init__.py"
    message: "C-2: a file that the python package does not allow; add it to its canonical, required or allowed files with its reason"

  - id: layout-php-ext-required
    kind: for_each_dir
    level: error
    select: "packages/php-ext"
    require:
      - { kind: file_exists, paths: "{path}/README.md" }
      - { kind: file_exists, paths: "{path}/README.ko.md" }
      - { kind: file_exists, paths: "{path}/composer.json" }
      - { kind: file_exists, paths: "{path}/composer.lock" }
      - { kind: file_exists, paths: "{path}/tests/ConformanceCase.php" }
      - { kind: file_exists, paths: "{path}/tests/ConformanceTest.php" }
      - { kind: file_exists, paths: "{path}/tests/PersistTest.php" }
      - { kind: file_exists, paths: "{path}/examples/persist.php" }
    message: "C-2: the php-ext package holds the canonical files and the required files of its kind"

  - id: layout-php-ext-folders
    kind: for_each_dir
    level: error
    select: "packages/php-ext"
    require:
      - { kind: file_exists, paths: "{path}/src/**" }
      - { kind: file_exists, paths: "{path}/tests/**" }
      - { kind: file_exists, paths: "{path}/examples/**" }
    message: "C-2: the php-ext package holds a file in each canonical folder (src, tests, examples)"

  - id: layout-php-ext-files
    kind: file_absent
    level: error
    paths:
      - "packages/php-ext/**"
      - "!packages/php-ext/README.md"
      - "!packages/php-ext/README.ko.md"
      - "!packages/php-ext/composer.json"
      - "!packages/php-ext/composer.lock"
      - "!packages/php-ext/tests/ConformanceCase.php"
      - "!packages/php-ext/tests/ConformanceTest.php"
      - "!packages/php-ext/tests/PersistTest.php"
      - "!packages/php-ext/examples/persist.php"
      - "!packages/php-ext/src/**"
      - "!packages/php-ext/examples/model/**"
    message: "C-2: a file that the php-ext package does not allow; add it to its canonical, required or allowed files with its reason"

  # The php and php-ext packages hold the same tests (C-2): the php-ext tests are the php tests, byte for byte.
  - id: layout-php-twin
    kind: cross_file
    level: error
    relation: identical
    source: { file: "packages/php/tests/ConformanceCase.php" }
    targets: [{ file: "packages/php-ext/tests/ConformanceCase.php" }]
    message: "C-2: the php-ext tests are byte-identical to the php tests"

  - id: layout-php-twin-test
    kind: cross_file
    level: error
    relation: identical
    source: { file: "packages/php/tests/ConformanceTest.php" }
    targets: [{ file: "packages/php-ext/tests/ConformanceTest.php" }]
    message: "C-2: the php-ext tests are byte-identical to the php tests"

  - id: layout-php-twin-persist
    kind: cross_file
    level: error
    relation: identical
    source: { file: "packages/php/tests/PersistTest.php" }
    targets: [{ file: "packages/php-ext/tests/PersistTest.php" }]
    message: "C-2: the php-ext tests are byte-identical to the php tests"

  # ---- The exceptions of fsm to the common layout rules (S9): each exception names its reason in the comment above it ----

  # The golden stub of the PHP extension is test data: packages/compiler/tests/golden/php-ext holds the expected output of
  # the compiler for the php-ext kind, which php-ext-backend.test.mjs compares with the generated files. It is not the stub
  # of a package; the stub of the package is packages/php-ext/src/polyspec_<repository>.stub.php.
  - id: php-ext-stub-place
    paths:
      - "**/*.stub.php"
      - "!packages/php-ext/src/*.stub.php"
      - "!packages/compiler/tests/golden/php-ext/src/*.stub.php"

  # The conformance suite of the rust package stays in the crate: Cargo's test target tests/conformance/main.rs and its
  # module vectors.rs (written by fsm-gen) lie in packages/rust, the crate whose Cargo.toml names them, and build.rs and
  # tests/common/mod.rs are shared with that crate; a suite outside the crate cannot be a target of its manifest.
  - id: suites-at-root
    paths:
      - "packages/**/integration"
      - "packages/**/conformance"
      - "!packages/rust/tests/conformance"

  # The VitePress site of docs/ is one npm project: docs/package.json and docs/package-lock.json are the input of npm ci in
  # docs (make docs-build, and the Pages workflow that runs it), and the site's config lies in docs/.vitepress.
  - id: docs-files
    paths:
      - "docs/*"
      - "!docs/features.md"
      - "!docs/features.ko.md"
      - "!docs/index.md"
      - "!docs/index.ko.md"
      - "!docs/404.md"
      - "!docs/404.ko.md"
      - "!docs/package.json"
      - "!docs/package-lock.json"

  # AGENTS, CHANGELOG and Makefile lie at the root only: each runtime package's targets are targets of the root Makefile, named
  # fsm-<package>-<task> (K245).
  - id: management-files-at-root
    paths:
      - "packages/**/AGENTS*.md"
      - "packages/**/CHANGELOG*.md"
      - "packages/**/Makefile"

  - id: runtime-language
    paths:
      - "packages/js/**/*.{ts,mts,cts,tsx}"
      - "packages/*/js/**/*.{ts,mts,cts,tsx}"
      - "!packages/**/*.d.ts"
      - "!packages/**/*.d.mts"
      - "!packages/**/*.d.cts"
