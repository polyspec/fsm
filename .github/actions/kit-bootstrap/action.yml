# The one bootstrap of every CI job of fsm (K992), taken from the example of kit and owned by fsm (S-424): ci-pipeline.yml,
# release.yml, ci.yml and pages.yml run it after their checkout with `uses: ./.github/actions/kit-bootstrap`, so no workflow
# carries a copy of these steps. The parity, runtime and release jobs set PHP up before it; the shared job of ci-pipeline sets it
# up after.
name: kit bootstrap
description: Sets up the Node.js of mise.toml, installs the locked kit package, then the npm of var/tools and the packages of package-lock.json.
runs:
  using: composite
  steps:
    # actions/setup-node v7.1.0: the Node.js of mise.toml starts the bootstrap, which installs that release into var/tools with
    # mise (K171); the tools of @polyspec/kit then run the node of var/tools. The pinned npm of var/tools installs the packages,
    # so the cache of setup-node is off.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: mise.toml
        package-manager-cache: false
    # The locked kit package is installed before the other targets run, since the recipes of the Makefile run its utilities:
    # make bootstrap runs the npm that devEngines of package.json names, outside the checkout (K938-1). npm reads
    # allow-remote=root of the .npmrc of the root, which the release URL of @polyspec/kit needs.
    - name: bootstrap the installed kit package
      shell: bash
      run: make bootstrap
    # The bootstrap order of a repository (K71-2): the mise, node and npm of mise.toml first, then the packages of
    # package-lock.json with it.
    - name: install npm
      shell: bash
      run: make install-tools TOOLS=npm
    - name: install packages
      shell: bash
      run: make install-packages
