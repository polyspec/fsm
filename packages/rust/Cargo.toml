[package]
name = "fsm-rust"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.0"
publish = false
description = "Rust consumer test bed of fsm: the generated state machines, the conformance vectors and the B-4 persistence example (docs/plans/fsm-v1.md, C-2)"

# The test targets are tests/conformance/main.rs, with its module tests/conformance/vectors.rs (Cargo's layout of a test target
# of several files), and tests/persist.rs; both take the modules tests/common/mod.rs and examples/persist.rs. The modules are no targets of their own, so automatic test and example discovery
# is off and the targets are named here.
autotests = false
autoexamples = false

[lints]
workspace = true

# The package is a workspace of its own, so it holds the lints of kit (config/cargo.schema.json): no unsafe code, and no allow
# attribute without its reason.
[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"

[[test]]
name = "conformance"
path = "tests/conformance/main.rs"

# tests/persist.rs holds the concurrency and retry tests of the persist example, the feature units of config/parity.json
# beyond the vector cases (docs/spec/fsm.md, B-4).
[[test]]
name = "persist"
path = "tests/persist.rs"

# The orm pins of docs/plans/fsm-v1.md, C-1: the model generator runs in build.rs, the runtime is used by the persist example.
[build-dependencies]
polyspec-orm-build = { git = "https://github.com/polyspec/orm.git", tag = "v0.0.18" }

[dev-dependencies]
polyspec-orm = { git = "https://github.com/polyspec/orm.git", tag = "v0.0.18" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
