# The assets of each platform of the core and its bindings (docs/plans/fsm-v1/plan.md, C-11; checklist S-470-9; binding GN-19a,
# GN-19g). The workflow ci calls it for the commit of its run, and the workflow release calls it for the tree of the tag that it
# releases, with release true, which runs the release check of binding before a job builds (make release-binding-check). That
# check fails while a dependency line of polyspec-binding-core names a branch or a commit (CK-70), the development form: a
# release of fsm needs a released tag of binding, which every line names, and CI builds the assets without the check.
#
# The job platform runs on the runner of its platform, ubuntu-26.04, ubuntu-26.04-arm or macos-15, the one exception to the
# runner rule of C-10: the asset of a platform is linked and loaded only on that platform, because no tool of the release
# compiles for another platform (make workflows-test checks the three entries). Each job builds the static library of the Go
# module, the abi3 wheel, the PHP extension for the PHP of .php-version and the npm platform package of its platform, and the
# job npm the npm package itself with the wasm-bindgen of mise.toml. Each uploads var/release/assets as an artifact, which the
# workflow release downloads. Each job has one run step, make ci-assets-platform or make ci-assets-npm with RELEASE, the input
# release, whose recipe in the Makefile holds the content of the job, so a local run makes the same call (S-484): the tools,
# then with RELEASE=true the release check of binding, then the builds; ci-assets-platform builds every asset to its end, so one
# run names every asset that does not build. The action runner-setup installs the LLVM of the platform job before it, because a
# recipe changes no setting of the machine.
name: assets

on:
  workflow_call:
    inputs:
      ref:
        description: The tag whose tree the jobs build; empty builds the commit of the calling run
        required: false
        type: string
        default: ''
      release:
        description: Whether each job runs the release check of binding before it builds
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The PHP of .php-version with its php-config, which the build of the extension reads; make release-php-ext PHP=php
      # resolves php on PATH, where no PHP of var/tools comes first, since the job installs none.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      # The LLVM of config/toolchain.json, whose libclang and clang the bindgen of ext-php-rs uses.
      - uses: ./.github/actions/runner-setup
        with:
          llvm: 'true'
      # make ci-assets-platform: the Rust toolchain of rust-toolchain.toml and the uv and the Python of mise.toml, with which uv
      # builds the wheel, then the assets.
      - name: Build the assets of the platform
        run: make ci-assets-platform RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-${{ matrix.platform }}
          path: var/release/assets/
          if-no-files-found: error

  npm:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/kit-bootstrap
      # make ci-assets-npm: the Rust toolchain and the wasm-bindgen of mise.toml, then the npm package.
      - name: Pack the npm package
        run: make ci-assets-npm RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-npm
          path: var/release/assets/
          if-no-files-found: error
