# Continuous integration (docs/plans/fsm-v1/plan.md, C-10 and Verification; docs/plans/fsm-v1/checklist.md, S-21). The job kit calls the pipeline ci-pipeline.yml of fsm (K910), the job assets calls assets.yml,
# which builds the assets of each platform on the runner of that platform (S-470-9), and the job check runs
# `make install` and then `make ci-suite`, the targets of make check that the job kit does not run (S-474). The
# job holds no block services: `make persist-images` pulls the images of PostgreSQL and MySQL that config/containers.json pins
# by their digests, through bay, and `make persist-servers` starts both servers through bay as a Compose project of the run, runs the
# targets on the runner of the job with their DSNs and removes the project (plan C-6, S-472-1, S-475, S-475-7). `make bay-install` installs bay
# before them (S-475-5). The job uploads the report of its targets. The last job ci-passed
# passes only when every other job succeeded (S-472); every job runs on ubuntu-26.04-arm, except the platform jobs of assets.yml,
# and each run step is one make target
# (make workflows-test).
# The versions come from the files that declare them: PHP from config/toolchain.json, Rust from rust-toolchain.toml, and
# Node.js, Go, Python and uv from mise.toml, which mise installs at the digests of mise.lock: Node.js with make install-tools
# TOOLS=npm, which the node of setup-node only starts (kit K171), and the others with make install (install-tools, S-44-6). The workflow runs on every push to main and on a manual run (workflow_dispatch). A newer push does
# not cancel the run of an earlier one.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; the job installs the toolchain of rust-toolchain.toml first.
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  kit:
    uses: ./.github/workflows/ci-pipeline.yml
  check:
    needs: kit
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          extensions: pdo_pgsql, pdo_mysql
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      # make install-tools of make install installs the Rust toolchain of rust-toolchain.toml with its components (kit K151).
      - name: Install the toolchains and the package dependencies
        run: make install
      - name: Install the system libraries of Chromium
        run: make gui-browser-libraries
      - name: Install the git hooks of fsm
        run: make hooks
      # bay runs the servers of the suite. A runner holds none, so make bay-install downloads the release that
      # config/toolchain.json names, verifies its sha256 and applies the machine setup. On the runner the state of bay belongs
      # to root and the user of the job has sudo without a password, so each step that starts bay sets BAY (plan C-6, S-475-5).
      - name: Install bay
        run: make bay-install
        env:
          BAY: sudo -n bay
      - name: Pull the images of the PostgreSQL and MySQL servers
        run: make persist-images
        env:
          BAY: sudo -n bay
      # make ci-suite runs the targets of make check that no job of the pipeline runs (CI_SUITE_TARGETS of the Makefile, S-474),
      # the check of the hooks among them, to their end, so one run names every failed target.
      - name: Run the suite targets through make ci-targets with the PostgreSQL and MySQL servers
        if: ${{ !cancelled() }}
        run: make ci-suite
        env:
          BAY: sudo -n bay
      # The report of make ci-targets, var/report/ci-targets, also of a run whose target failed.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsm-report-check
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The assets of each platform of the commit, built as a release builds them (assets.yml, S-470-9), without the release check of
  # binding, which fails until binding releases a tag (CK-70); ci-passed requires them, so a release tags only a commit whose
  # assets built.
  assets:
    uses: ./.github/workflows/assets.yml

  # The result of the run: the job runs after every other job, also after a failed or cancelled one, and make ci-passed
  # passes only when each job of needs has the result success; a skipped job fails it (FAIL_SKIPPED=1). make
  # workflows-test fails this workflow when ci-passed is not its last job or when needs leaves a job out.
  ci-passed:
    if: ${{ always() }}
    needs: [kit, check, assets]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-passed FAIL_SKIPPED=1
