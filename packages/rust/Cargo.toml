[package]
name = "polyspec-fsm"
version = "0.0.14"
license = "MIT"
edition = "2021"
rust-version = "1.99.0"
description = "The core of fsm: a state machine read from its definition, its codes and keys, and its transitions"
readme = "README.md"
repository = "https://github.com/polyspec/fsm.git"
publish = false
# The package holds the interface contract of the bindings beside the source (binding design I-1).
include = ["/src/**/*.rs", "/interface.json", "/README.md"]

[dependencies]
# The kind interface that the generated bindings read from the core error (binding design E-1). The git source is the binding
# repository at the tag of its release, the same source as the generated binding crates (binding CK-20, CK-70).
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.8" }
# The reader of a definition (docs/spec/fsm.md, B-1), at the exact pin of polyspec-binding-core. validate reports its findings
# in the order of the keys of the document (B-5), so a map keeps its keys in their order (preserve_order).
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[dev-dependencies]
libtest-mimic = "=0.8.2"
serde_json = "=1.0.154"

[lib]
name = "polyspec_fsm"
path = "src/lib.rs"

# One trial per case of contracts/cases.json, so the harness of the test is libtest-mimic.
[[test]]
name = "cases"
harness = false

# One trial per vector of contracts/conformance/vectors.json, the common suite of the legacy tests that the conformance tests of
# the bindings run too.
[[test]]
name = "conformance"
harness = false

# The lints of the root workspace (Cargo.toml of the repository), which make lint-rust (cargo clippy) reads.
[lints]
workspace = true
