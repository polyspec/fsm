[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

# The python package of fsm (docs/plans/fsm-v1/plan.md, C-2). The orm client is pinned to the wheel of its release (C-1), and the
# generated code under src/ and examples/model/ has no runtime dependency beyond the standard library.
[project]
name = "polyspec-fsm"
version = "0.0.11"
description = "python package of fsm: the generated state machines, the conformance vectors and the B-4 persistence example"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "polyspec-orm @ https://github.com/polyspec/orm/releases/download/v0.0.28/polyspec_orm-0.0.28-py3-none-any.whl",
]

# The examples are a package of the project, so that their tests import them from the installed package (S3): the persist example
# and its generated model are polyspec_fsm_examples.persist and polyspec_fsm_examples.model.models.
[tool.setuptools]
package-dir = { "" = "src", "polyspec_fsm_examples" = "examples", "polyspec_fsm_examples.model" = "examples/model" }
packages = ["polyspec_fsm", "polyspec_fsm_examples", "polyspec_fsm_examples.model"]

# vulture of make lint-python reports the unused code of the package from the confidence 60, which reports unused functions and
# classes (S-424).
[tool.vulture]
min_confidence = 60
