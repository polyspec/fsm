# The documentation site (docs/plans/fsm-v1/plan.md, C-8 and C-10; docs/plans/fsm-v1/checklist.md, S-21). Every push to main
# builds the site with `make docs-build` at the base /fsm/, the path of the GitHub Pages site of polyspec/fsm, and deploys it.
# A manual run (workflow_dispatch) does the same. A newer commit of main does not cancel the deployment of an earlier one.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: bootstrap the locked kit package
        run: |
          npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
      - name: Install kit, the npm of packageManager and then @polyspec/kit of package-lock.json
        run: |
          make install-tools TOOLS=npm
          make install-packages
      - name: Build the site
        run: make docs-build
        env:
          VITEPRESS_BASE: /fsm/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
