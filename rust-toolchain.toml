[toolchain]
channel = "1.99.0"
profile = "minimal"
# clippy is the lint of make lint-rust. llvm-tools holds llvm-strip, llvm-size and llvm-nm, which the release of the Go module
# reads from the toolchain of the checkout, never from PATH (checklist S-470-1).
components = ["clippy", "llvm-tools"]
# wasm32-unknown-unknown is the target of the WASM crate of packages/ts/wasm, which make node-package and make release-npm build;
# make install-tools installs it with the toolchain, so a job that builds the npm package needs no step of its own.
targets = ["wasm32-unknown-unknown"]
