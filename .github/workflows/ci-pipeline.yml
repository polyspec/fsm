# The CI pipeline of fsm (K270, K910), taken from the example of kit and owned by fsm (S-424); every make target it runs is a
# target of the Makefile of fsm. .github/workflows/ci.yml holds the triggers and the concurrency and calls it as a job
# (`uses: ./.github/workflows/ci-pipeline.yml`), so one push runs one workflow: shared first, then the runtime jobs in
# parallel, then required. Each job installs only its own locked prerequisites, declared in config/ci.json or selected from the
# repository's deps-<runtime> targets (K859), and runs the gate of its group with the targets that config/ci.json declares for
# that group (targets.shared, targets.runtimes.<runtime>) through make ci-targets, inside its context window.
# Each run step is one make target (S-472). A value that an expression gives, the tools and the targets of the plan and the
# runtime of the matrix, reaches the target as a variable of the environment of its step alone (TOOLS, TARGETS, RUNTIME), which
# make reads as the variable of that name; the command of the step holds no expression. Every job names the runner
# ubuntu-26.04-arm, which runner of config/ci.json names too (make workflows-test compares them).
name: ci-pipeline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The shared job writes the plan of the runtime jobs.
  shared:
    runs-on: ubuntu-26.04-arm
    outputs:
      runtimes: ${{ steps.plan.outputs.runtimes }}
      has_runtimes: ${{ steps.plan.outputs.has_runtimes }}
    steps:
      # actions/checkout v7.0.1: with the whole history, which the checks of the documents and the owners read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - id: plan
        run: make kit-ci-plan
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, when a common gate tool of the plan needs it.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ contains(steps.plan.outputs.common_tools, 'php') }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - name: install common gate tools
        if: ${{ steps.plan.outputs.common_tools != '[]' }}
        env:
          TOOLS: ${{ join(fromJSON(steps.plan.outputs.common_tools), ' ') }}
        run: make install-tools
      - name: install shared prerequisites
        run: make kit-ci-setup GROUP=shared
      - id: context_prepare
        name: prepare shared CI context
        run: make kit-ci-context-prepare GROUP=shared
      - name: shared gates
        env:
          TARGETS: kit-gates-static ${{ join(fromJSON(steps.plan.outputs.shared_targets), ' ') }}
        run: make ci-targets
      - name: cleanup shared CI context
        if: ${{ always() && steps.context_prepare.outcome != 'skipped' }}
        run: make kit-ci-context-cleanup GROUP=shared
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  runtime:
    needs: shared
    if: ${{ needs.shared.outputs.has_runtimes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shared.outputs.runtimes) }}
    runs-on: ubuntu-26.04-arm
    steps:
      # actions/checkout v7.0.1 and shivammathur/setup-php 2.40.0, the PHP of .php-version for the PHP runtimes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ matrix.runtime == 'php' || matrix.runtime == 'php-ext' }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - name: install runtime tools
        if: ${{ join(matrix.installTools, ' ') != '' }}
        env:
          TOOLS: ${{ join(matrix.installTools, ' ') }}
        run: make install-tools
      - name: install runtime prerequisites
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: make kit-ci-setup GROUP=runtime
      - name: install PHP symbol extractor
        if: ${{ matrix.runtime == 'php' }}
        run: make kit-install-symbols EXTRACTORS=php
      - id: context_prepare
        name: prepare runtime CI context
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: make kit-ci-context-prepare GROUP=runtime
      - name: runtime gate
        env:
          TARGETS: kit-gates-runtime-${{ matrix.runtime }} ${{ join(matrix.targets, ' ') }}
        run: make ci-targets
      - name: cleanup runtime CI context
        if: ${{ always() && steps.context_prepare.outcome != 'skipped' }}
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: make kit-ci-context-cleanup GROUP=runtime
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-runtime-${{ matrix.runtime }}
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The closing part: it runs after shared and runtime, also after a failed or cancelled one, and make ci-passed passes only
  # when each of them has the result success. config/ci.json declares runtimes, so the plan selects the job runtime in every
  # run, and a skipped job fails the pipeline (FAIL_SKIPPED=1): runtime is skipped only when shared wrote no plan.
  required:
    if: ${{ always() }}
    needs: [shared, runtime]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The bootstrap of kit (K992), whose utility ci-passed the target runs.
      - uses: ./.github/actions/kit-bootstrap
      - name: require shared and runtime
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-passed FAIL_SKIPPED=1
