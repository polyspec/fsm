[package]
name = "polyspec-fsm"
version = "0.0.5"
edition = "2021"
rust-version = "1.99.0"
publish = false
description = "Rust package of fsm: the generated state machines, the conformance vectors and the B-4 persistence example (docs/plans/fsm-v1/plan.md, C-2)"

# The test targets are tests/conformance/main.rs, with its module tests/conformance/vectors.rs (Cargo's layout of a test target
# of several files), and tests/persist.rs; both take the modules tests/common/mod.rs and examples/persist.rs. The modules are no targets of their own, so automatic test and example discovery
# is off and the targets are named here.
autotests = false
autoexamples = false

[lints]
workspace = true

# The package is a workspace of its own, so it holds the lints of fsm, as the example of kit states them (S-424): every warning
# fails, no unsafe code, and no hidden error (P8): a dropped must_use value, a `let _` of a must_use or untyped value, a map_err
# that ignores its error and an allow attribute without its reason. clippy.toml of the root disallows Result::ok and the
# unwrap_or family.
[workspace]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"

[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
# libtest-mimic runs one trial per case of contracts/conformance/vectors.json, which is read when the test runs.
harness = false

# tests/persist.rs holds the concurrency and retry tests of the persist example,
# beyond the vector cases (docs/spec/fsm.md, B-4).
[[test]]
name = "persist"
path = "tests/persist.rs"

# The orm pins of docs/plans/fsm-v1/plan.md, C-1: the model generator runs in build.rs, the runtime is used by the persist example.
[build-dependencies]
polyspec-orm-build = { git = "https://github.com/polyspec/orm.git", tag = "v0.0.23" }

[dependencies]
# The decoded value of from_code (docs/spec/fsm.md, B-6): the generated modules take a serde_json::Value.
serde_json = "1.0.151"

[dev-dependencies]
polyspec-orm = { git = "https://github.com/polyspec/orm.git", tag = "v0.0.23" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
libtest-mimic = "0.8.2"
