# Continuous integration (docs/plans/fsm-v1/plan.md, C-10 and Verification; docs/plans/fsm-v1/checklist.md, S-21). The job kit calls the pipeline ci-pipeline.yml of fsm (K910), and the job check runs
# `make install` and then its suite targets through `make ci-targets` (the shared and runtime targets run in the job kit). The
# job holds no block services: `make persist-images` pulls the images of PostgreSQL and MySQL that config/containers.json pins
# by their digests, and `make persist-servers` starts both servers in docker containers of the run, passes their DSNs to the
# targets and removes the containers (plan C-6, S-472-1). The job uploads the report of its targets. The last job ci-passed
# passes only when every other job succeeded (S-472); every job runs on ubuntu-26.04-arm, and each run step is one make target
# (make workflows-test).
# The versions come from the files that declare them: PHP from config/toolchain.json, Rust from rust-toolchain.toml, and
# Node.js, Go, Python and uv from mise.toml, which mise installs at the digests of mise.lock: Node.js with make install-tools
# TOOLS=npm, which the node of setup-node only starts (kit K171), and the others with make install (install-tools, S-44-6). The workflow runs on every push to main and on a manual run (workflow_dispatch). A newer push does
# not cancel the run of an earlier one.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; the job installs the toolchain of rust-toolchain.toml first.
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  kit:
    uses: ./.github/workflows/ci-pipeline.yml
  check:
    needs: kit
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          extensions: pdo_pgsql, pdo_mysql
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      # make install-tools of make install installs the Rust toolchain of rust-toolchain.toml with its components (kit K151).
      - name: Install the toolchains and the package dependencies
        run: make install
      - name: Install the system libraries of Chromium
        run: make gui-browser-libraries
      - name: Install the git hooks of fsm
        run: make hooks
      - name: Check the git hooks
        run: make ci-targets TARGETS="hooks-check"
      - name: Pull the images of the PostgreSQL and MySQL servers
        run: make persist-images
      # The suite runs after a failed check of the hooks too, so one run names every failed target.
      - name: Run the suite targets through make ci-targets with the PostgreSQL and MySQL servers
        if: ${{ !cancelled() }}
        run: make persist-servers TARGETS="compiler-test db-test db-test-postgres db-test-mysql npm-persist-test npm-persist-test-postgres npm-persist-test-mysql gui-test npm-types name-test name-check docs-build docs-build-test packages-test gui-browser-test readme-test readme-check python-tools-test make-install-test package-names-test rust-persist-test go-persist-test-postgres go-persist-test-mysql rust-persist-test-postgres rust-persist-test-mysql php-persist-test-postgres php-persist-test-mysql php-ext-persist-test-postgres php-ext-persist-test-mysql python-persist-test-postgres python-persist-test-mysql workflows-test container-test persist-servers-test test-rust commit-names-test commit-names-check"
      # The report of make ci-targets, var/report/ci-targets, also of a run whose target failed.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsm-report-check
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The result of the run: the job runs after every other job, also after a failed or cancelled one, and make ci-passed
  # passes only when each job of needs has the result success; a skipped job fails it (FAIL_SKIPPED=1). make
  # workflows-test fails this workflow when ci-passed is not its last job or when needs leaves a job out.
  ci-passed:
    if: ${{ always() }}
    needs: [kit, check]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-passed FAIL_SKIPPED=1
